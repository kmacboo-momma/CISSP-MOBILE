<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0F1729" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CISSP" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<title>CISSP Study</title>
<style>
  :root {
    --bg: #0F1729;
    --surface: #1B2438;
    --surface-2: #232E46;
    --line: #2E3A54;
    --ink: #E8EDF7;
    --ink-dim: #94A3BE;
    --ink-faint: #64748B;
    --green: #3DD68C;
    --green-dim: #1E5A42;
    --amber: #F5A623;
    --amber-dim: #5A4318;
    --cyan: #4EA8DE;
    --red: #F0656B;
    --red-dim: #5A2528;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  #root { min-height: 100vh; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  .safe-top { padding-top: env(safe-area-inset-top); }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  /* Fallback message if the app fails to boot */
  #boot-error { display:none; padding:40px 24px; text-align:center; color:var(--amber); font-size:15px; line-height:1.6; }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot-error">
  The app couldn't start. This is usually a stale cache —
  in Safari, clear website data for this site, or delete and re-add the home-screen app.
</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script>
  // Force Babel to use the CLASSIC JSX runtime (React.createElement) instead of
  // the automatic runtime, which emits `import ... from "react/jsx-runtime"` —
  // a bare module specifier that browsers can't resolve without a bundler.
  // This is the fix for the "import declarations may only appear at top level
  // of a module" error / blank screen.
  if (window.Babel) {
    Babel.registerPreset("react-classic", {
      presets: [[Babel.availablePresets["react"], { runtime: "classic" }]],
    });
  } else {
    document.getElementById("boot-error").style.display = "block";
  }
  // Show the fallback if React never renders within a few seconds.
  setTimeout(function () {
    var root = document.getElementById("root");
    if (root && root.innerHTML.trim() === "") {
      document.getElementById("boot-error").style.display = "block";
    }
  }, 4000);
</script>
<script src="content.js"></script>

<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useMemo, useCallback } = React;
const { DOMAINS, FLASHCARDS, QUIZ } = window.CISSP_DATA;

// ---- persistence ----------------------------------------------------------
const STORE_KEY = "cissp_progress_v1";
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch {}
}

// ---- small ui helpers -----------------------------------------------------
const domainColor = (d) => {
  const hues = [null, "#4EA8DE", "#8B7FE8", "#3DD68C", "#F5A623", "#E86FB0", "#4EC9C9", "#F0656B", "#B4C24E"];
  return hues[d] || "#4EA8DE";
};

function ProgressRing({ pct, size = 44, stroke = 4, color }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - pct);
  return (
    <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--line)" strokeWidth={stroke} />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
        strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
        style={{ transition: "stroke-dashoffset .5s ease" }} />
    </svg>
  );
}

// ===========================================================================
//  HOME / DASHBOARD
// ===========================================================================
function Home({ progress, go }) {
  const stats = useMemo(() => {
    const seen = progress.cardsSeen || {};
    const quizAns = progress.quiz || {};
    const totalCards = FLASHCARDS.length;
    const seenCount = Object.keys(seen).length;
    const quizKeys = Object.keys(quizAns);
    const correct = quizKeys.filter(k => quizAns[k].correct).length;
    return {
      seenCount, totalCards,
      quizTaken: quizKeys.length,
      quizAccuracy: quizKeys.length ? Math.round(correct / quizKeys.length * 100) : 0,
    };
  }, [progress]);

  const perDomain = useMemo(() => {
    const seen = progress.cardsSeen || {};
    const quizAns = progress.quiz || {};
    return DOMAINS.map(dom => {
      const cards = FLASHCARDS.filter(c => c.domain === dom.id);
      const seenN = cards.filter(c => seen[c.id]).length;
      const qs = QUIZ.filter(q => q.domain === dom.id);
      const answered = qs.filter(q => quizAns[q.id]);
      const correct = answered.filter(q => quizAns[q.id].correct).length;
      const cardPct = cards.length ? seenN / cards.length : 0;
      return {
        ...dom,
        cardsTotal: cards.length, cardsSeen: seenN, cardPct,
        quizTotal: qs.length, quizCorrect: correct, quizAnswered: answered.length,
      };
    });
  }, [progress]);

  return (
    <div style={{ padding: "0 18px 40px" }}>
      <div style={{ padding: "22px 0 18px" }}>
        <div style={{ fontSize: 13, color: "var(--ink-faint)", letterSpacing: .3 }}>Your prep</div>
        <h1 style={{ margin: "2px 0 0", fontSize: 30, fontWeight: 800, letterSpacing: -.5 }}>CISSP Study</h1>
      </div>

      {/* headline stats */}
      <div style={{ display: "flex", gap: 12, marginBottom: 20 }}>
        <div style={statCard}>
          <div style={{ fontSize: 34, fontWeight: 800, lineHeight: 1 }}>{stats.seenCount}<span style={{ fontSize: 16, color: "var(--ink-faint)", fontWeight: 600 }}>/{stats.totalCards}</span></div>
          <div style={statLabel}>Cards studied</div>
        </div>
        <div style={statCard}>
          <div style={{ fontSize: 34, fontWeight: 800, lineHeight: 1, color: stats.quizAccuracy >= 70 ? "var(--green)" : "var(--amber)" }}>
            {stats.quizAccuracy}<span style={{ fontSize: 16, fontWeight: 600 }}>%</span>
          </div>
          <div style={statLabel}>Quiz accuracy</div>
        </div>
      </div>

      {/* actions */}
      <div style={{ display: "flex", gap: 12, marginBottom: 26 }}>
        <button onClick={() => go({ view: "cards" })} style={{ ...actionBtn, background: "var(--cyan)", color: "#08111F" }}>
          Flashcards →
        </button>
        <button onClick={() => go({ view: "quiz" })} style={{ ...actionBtn, background: "var(--surface-2)", color: "var(--ink)", border: "1px solid var(--line)" }}>
          Quiz →
        </button>
      </div>

      {/* per-domain */}
      <div style={{ fontSize: 13, color: "var(--ink-faint)", marginBottom: 10, letterSpacing: .3 }}>By domain</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {perDomain.map(d => (
          <button key={d.id} onClick={() => go({ view: "cards", domain: d.id })}
            style={{ ...domainRow, textAlign: "left" }}>
            <ProgressRing pct={d.cardPct} color={domainColor(d.id)} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
                <span style={{ fontSize: 12, fontWeight: 700, color: domainColor(d.id) }}>{d.id}</span>
                <span style={{ fontSize: 15, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{d.name}</span>
              </div>
              <div style={{ fontSize: 12, color: "var(--ink-dim)", marginTop: 3 }}>
                {d.cardsSeen}/{d.cardsTotal} cards · {d.quizAnswered ? `${Math.round(d.quizCorrect/d.quizAnswered*100)}% quiz` : "no quiz yet"} · {d.weight}% of exam
              </div>
            </div>
          </button>
        ))}
      </div>

      <div style={{ marginTop: 28, textAlign: "center", fontSize: 12, color: "var(--ink-faint)" }}>
        Add your own cards & questions by editing <code style={{ color: "var(--cyan)" }}>content.js</code>
      </div>
    </div>
  );
}

// ===========================================================================
//  FLASHCARDS
// ===========================================================================
function Flashcards({ progress, setProgress, filterDomain, back }) {
  const deck = useMemo(() => {
    let d = filterDomain ? FLASHCARDS.filter(c => c.domain === filterDomain) : FLASHCARDS.slice();
    return d;
  }, [filterDomain]);

  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const card = deck[idx];

  useEffect(() => {
    if (!card) return;
    setProgress(p => {
      const cardsSeen = { ...(p.cardsSeen || {}), [card.id]: true };
      return { ...p, cardsSeen };
    });
  }, [card]);

  const next = useCallback((markKnown) => {
    if (card) {
      setProgress(p => {
        const cardStatus = { ...(p.cardStatus || {}), [card.id]: markKnown ? "known" : "review" };
        return { ...p, cardStatus };
      });
    }
    setFlipped(false);
    setIdx(i => (i + 1) % deck.length);
  }, [card, deck.length]);

  if (!card) {
    return (
      <Screen title="Flashcards" back={back}>
        <Empty msg="No cards in this domain yet. Add some in content.js." />
      </Screen>
    );
  }

  const dc = domainColor(card.domain);
  return (
    <Screen title={filterDomain ? `Domain ${filterDomain}` : "All flashcards"} back={back}
      subtitle={`${idx + 1} of ${deck.length}`}>
      <div style={{ padding: "0 18px" }}>
        {/* progress bar */}
        <div style={{ height: 4, background: "var(--line)", borderRadius: 4, marginBottom: 22, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${(idx+1)/deck.length*100}%`, background: dc, transition: "width .3s" }} />
        </div>

        {/* card */}
        <button onClick={() => setFlipped(f => !f)}
          style={{
            width: "100%", minHeight: 320, borderRadius: 20, padding: "28px 24px",
            background: flipped ? "var(--surface-2)" : "var(--surface)",
            border: `1px solid ${flipped ? dc : "var(--line)"}`,
            display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center",
            textAlign: "center", transition: "border-color .2s, background .2s", position: "relative",
          }}>
          <div style={{ position: "absolute", top: 16, left: 18, fontSize: 11, fontWeight: 700, color: dc }}>
            DOMAIN {card.domain}
          </div>
          <div style={{ position: "absolute", top: 16, right: 18, fontSize: 11, color: "var(--ink-faint)" }}>
            {flipped ? "answer" : "tap to flip"}
          </div>
          <div style={{ fontSize: flipped ? 17 : 21, fontWeight: flipped ? 500 : 700, lineHeight: 1.5, color: "var(--ink)" }}>
            {flipped ? card.back : card.front}
          </div>
        </button>

        {/* controls */}
        {!flipped ? (
          <button onClick={() => setFlipped(true)} style={{ ...wideBtn, marginTop: 18, background: "var(--surface-2)", border: "1px solid var(--line)" }}>
            Show answer
          </button>
        ) : (
          <div style={{ display: "flex", gap: 12, marginTop: 18 }}>
            <button onClick={() => next(false)} style={{ ...wideBtn, background: "var(--amber-dim)", color: "var(--amber)", flex: 1 }}>
              Review again
            </button>
            <button onClick={() => next(true)} style={{ ...wideBtn, background: "var(--green-dim)", color: "var(--green)", flex: 1 }}>
              Got it
            </button>
          </div>
        )}

        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 20 }}>
          <button onClick={() => { setFlipped(false); setIdx(i => (i - 1 + deck.length) % deck.length); }}
            style={navBtn}>← Prev</button>
          <button onClick={() => { setFlipped(false); setIdx(i => (i + 1) % deck.length); }}
            style={navBtn}>Skip →</button>
        </div>
      </div>
    </Screen>
  );
}

// ===========================================================================
//  QUIZ
// ===========================================================================
function Quiz({ progress, setProgress, filterDomain, back }) {
  const pool = useMemo(() => {
    let q = filterDomain ? QUIZ.filter(x => x.domain === filterDomain) : QUIZ.slice();
    // shuffle
    for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [q[i],q[j]]=[q[j],q[i]]; }
    return q;
  }, [filterDomain]);

  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0 });
  const [done, setDone] = useState(false);
  const q = pool[idx];

  const choose = (ci) => {
    if (picked !== null) return;
    setPicked(ci);
    const correct = ci === q.answer;
    setScore(s => ({ right: s.right + (correct ? 1 : 0), total: s.total + 1 }));
    setProgress(p => ({ ...p, quiz: { ...(p.quiz || {}), [q.id]: { correct, at: Date.now() } } }));
  };

  const next = () => {
    if (idx + 1 >= pool.length) { setDone(true); return; }
    setIdx(i => i + 1); setPicked(null);
  };

  if (!q) return <Screen title="Quiz" back={back}><Empty msg="No questions in this domain yet. Add some in content.js." /></Screen>;

  if (done) {
    const pct = Math.round(score.right / score.total * 100);
    return (
      <Screen title="Quiz complete" back={back}>
        <div style={{ padding: "40px 18px", textAlign: "center" }}>
          <div style={{ fontSize: 60, fontWeight: 800, color: pct >= 70 ? "var(--green)" : "var(--amber)" }}>{pct}%</div>
          <div style={{ fontSize: 16, color: "var(--ink-dim)", marginTop: 4 }}>{score.right} of {score.total} correct</div>
          <div style={{ marginTop: 10, fontSize: 14, color: pct >= 70 ? "var(--green)" : "var(--amber)" }}>
            {pct >= 70 ? "Passing range — keep it up." : "Below 70% — worth another pass."}
          </div>
          <button onClick={back} style={{ ...wideBtn, marginTop: 30, background: "var(--cyan)", color: "#08111F", maxWidth: 260, marginLeft: "auto", marginRight: "auto" }}>
            Back to home
          </button>
        </div>
      </Screen>
    );
  }

  const dc = domainColor(q.domain);
  const answered = picked !== null;
  return (
    <Screen title={filterDomain ? `Domain ${filterDomain} quiz` : "Quiz"} back={back}
      subtitle={`${idx + 1} of ${pool.length} · ${score.right}/${score.total}`}>
      <div style={{ padding: "0 18px 30px" }}>
        <div style={{ height: 4, background: "var(--line)", borderRadius: 4, marginBottom: 20, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${(idx)/pool.length*100}%`, background: dc, transition: "width .3s" }} />
        </div>

        <div style={{ fontSize: 11, fontWeight: 700, color: dc, marginBottom: 8 }}>DOMAIN {q.domain}</div>
        <div style={{ fontSize: 18, fontWeight: 600, lineHeight: 1.45, marginBottom: 22 }}>{q.q}</div>

        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {q.choices.map((ch, ci) => {
            let bg = "var(--surface)", bd = "var(--line)", fg = "var(--ink)";
            if (answered) {
              if (ci === q.answer) { bg = "var(--green-dim)"; bd = "var(--green)"; fg = "var(--green)"; }
              else if (ci === picked) { bg = "var(--red-dim)"; bd = "var(--red)"; fg = "var(--red)"; }
            }
            return (
              <button key={ci} onClick={() => choose(ci)}
                style={{
                  textAlign: "left", padding: "16px 16px", borderRadius: 14,
                  background: bg, border: `1px solid ${bd}`, color: fg,
                  fontSize: 15, fontWeight: 500, lineHeight: 1.4,
                  display: "flex", gap: 12, alignItems: "flex-start",
                  transition: "all .15s",
                }}>
                <span style={{ fontWeight: 700, color: answered && (ci === q.answer || ci === picked) ? fg : "var(--ink-faint)" }}>
                  {String.fromCharCode(65 + ci)}
                </span>
                <span>{ch}</span>
              </button>
            );
          })}
        </div>

        {answered && (
          <div style={{ marginTop: 18, padding: "16px", borderRadius: 14, background: "var(--surface-2)", border: "1px solid var(--line)" }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: picked === q.answer ? "var(--green)" : "var(--amber)", marginBottom: 6 }}>
              {picked === q.answer ? "CORRECT" : "EXPLANATION"}
            </div>
            <div style={{ fontSize: 14, color: "var(--ink-dim)", lineHeight: 1.5 }}>{q.explain}</div>
          </div>
        )}

        {answered && (
          <button onClick={next} style={{ ...wideBtn, marginTop: 18, background: "var(--cyan)", color: "#08111F" }}>
            {idx + 1 >= pool.length ? "See results" : "Next question →"}
          </button>
        )}
      </div>
    </Screen>
  );
}

// ===========================================================================
//  SHELL
// ===========================================================================
function Screen({ title, subtitle, back, children }) {
  return (
    <div>
      <div className="safe-top" style={{ position: "sticky", top: 0, zIndex: 10, background: "rgba(15,23,41,.9)", backdropFilter: "blur(12px)", borderBottom: "1px solid var(--line)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 16px" }}>
          <button onClick={back} style={{ fontSize: 15, color: "var(--cyan)", fontWeight: 600, padding: "4px 0" }}>← Home</button>
          <div style={{ flex: 1, textAlign: "center" }}>
            <div style={{ fontSize: 15, fontWeight: 700 }}>{title}</div>
            {subtitle && <div style={{ fontSize: 12, color: "var(--ink-faint)" }}>{subtitle}</div>}
          </div>
          <div style={{ width: 52 }} />
        </div>
      </div>
      <div style={{ paddingTop: 18 }}>{children}</div>
    </div>
  );
}

function Empty({ msg }) {
  return <div style={{ padding: "60px 30px", textAlign: "center", color: "var(--ink-faint)", fontSize: 15 }}>{msg}</div>;
}

// ===========================================================================
//  APP
// ===========================================================================
function App() {
  const [progress, setProgressState] = useState(loadProgress);
  const [route, setRoute] = useState({ view: "home" });

  const setProgress = useCallback((updater) => {
    setProgressState(prev => {
      const nextVal = typeof updater === "function" ? updater(prev) : updater;
      saveProgress(nextVal);
      return nextVal;
    });
  }, []);

  const go = (r) => setRoute(r);
  const home = () => setRoute({ view: "home" });

  if (route.view === "cards") return <Flashcards progress={progress} setProgress={setProgress} filterDomain={route.domain} back={home} />;
  if (route.view === "quiz") return <Quiz progress={progress} setProgress={setProgress} filterDomain={route.domain} back={home} />;
  return <Home progress={progress} go={go} />;
}

// ---- styles ----------------------------------------------------------------
const statCard = { flex: 1, background: "var(--surface)", border: "1px solid var(--line)", borderRadius: 16, padding: "16px 16px 14px" };
const statLabel = { fontSize: 12, color: "var(--ink-dim)", marginTop: 8 };
const actionBtn = { flex: 1, padding: "16px", borderRadius: 14, fontSize: 16, fontWeight: 700 };
const domainRow = { display: "flex", alignItems: "center", gap: 14, background: "var(--surface)", border: "1px solid var(--line)", borderRadius: 14, padding: "12px 14px", width: "100%" };
const wideBtn = { width: "100%", padding: "15px", borderRadius: 14, fontSize: 15, fontWeight: 700 };
const navBtn = { fontSize: 14, color: "var(--ink-dim)", fontWeight: 600, padding: "8px 4px" };

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

// ---- register service worker ----
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
